# Discito on Coolify (Docker Compose build pack) — and local prod-like runs:
#   docker compose --env-file .env.production up --build
# Real secrets live in .env.production (gitignored) — never commit it.
name: discito

services:
  app:
    build:
      context: .
    restart: unless-stopped
    environment:
      APP_ENV: prod
      DATABASE_URL: sqlite:////data/discito.db
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      PARENT_PASSWORD: ${PARENT_PASSWORD:?set PARENT_PASSWORD}
      HOUSEHOLD_PASSWORD: ${HOUSEHOLD_PASSWORD:-}
      TIMEZONE: ${TIMEZONE:-America/Los_Angeles}
      WHISPER_URL: http://whisper:9000
    volumes:
      - discito-data:/data
    # Start alongside whisper rather than waiting for it: spelling and the parent
    # area work without it, and the recite page reports "listening service is down"
    # until the model is loaded (about a minute on first boot).
    depends_on:
      whisper:
        condition: service_started
    networks: [default, internal]
    # The container sits on several networks (compose default, internal, and
    # Coolify's proxy network). Tell Traefik which one to dial, or it may pick
    # one the proxy isn't attached to and answer 504 Gateway Timeout.
    labels:
      traefik.docker.network: coolify
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3

  whisper:
    build:
      context: ./whisper
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small.en}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}
    # Internal only: no ports, no domain. The app reaches it at http://whisper:9000.
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

networks:
  internal:
    internal: true

volumes:
  discito-data:
