[project]
name = "discito"
version = "0.1.0"
description = "Verse Memorizer — recitation and spelling practice for one household."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2.0",         # signed session cookie (Starlette SessionMiddleware)
    "tzdata>=2024.1",              # IANA zones for streak day boundaries (slim images lack them)
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.9",
    "mypy>=1.11.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["whisper"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E501: line length is handled by formatting, not linting.
# B008: FastAPI injects via Depends()/Form() in argument defaults by design.
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["whisper/", "alembic/"]
